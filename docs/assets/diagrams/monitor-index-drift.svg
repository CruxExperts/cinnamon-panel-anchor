  <rect x="52" y="96" width="330" height="170" rx="10" fill="#ffffff" stroke="#c7d1d8"/>
  <rect x="82" y="126" width="120" height="72" rx="6" fill="#dfe8ee"/>
  <rect x="232" y="126" width="120" height="72" rx="6" fill="#dfe8ee"/>
  <text x="107" y="170" font-family="Arial" font-size="18" fill="#16324f">0 HDMI-1</text>
  <text x="255" y="170" font-family="Arial" font-size="18" fill="#16324f">1 DP-2</text>
  <rect x="82" y="210" width="120" height="12" fill="#47b39c"/>
  <text x="92" y="246" font-family="Arial" font-size="16" fill="#4b5963">Panel anchored to HDMI-1</text>
