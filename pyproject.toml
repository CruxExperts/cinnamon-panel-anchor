[project]
name = "cinnamon-panel-anchor"
version = "0.2.2"
description = "Native Cinnamon applet and Python backend that keep panel placement anchored to monitor connectors on X11."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Slavic Kozyuk" }]
keywords = ["cinnamon", "linux-mint", "x11", "xrandr", "panel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CruxExperts/cinnamon-panel-anchor"
Repository = "https://github.com/CruxExperts/cinnamon-panel-anchor"
Issues = "https://github.com/CruxExperts/cinnamon-panel-anchor/issues"
Changelog = "https://github.com/CruxExperts/cinnamon-panel-anchor/blob/main/CHANGELOG.md"

[project.scripts]
cinnamon-panel-anchor = "cinnamon_panel_anchor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinnamon_panel_anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
